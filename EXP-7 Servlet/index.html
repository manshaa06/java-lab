<!DOCTYPE html>
<html>
<head>
    <title>Java Servlet Lab</title>
</head>
<body>

<h1>Student Login</h1>
<form action="login" method="post">
    Username: <input type="text" name="username"><br><br>
    Password: <input type="password" name="password"><br><br>
    <input type="submit" value="Login">
</form>

<hr>

<h1>Student Information (POST Form)</h1>
<form action="hello" method="post">
    Name: <input type="text" name="name"><br><br>
    Email: <input type="email" name="email"><br><br>
    Course: <input type="text" name="course"><br><br>
    <input type="submit" value="Register">
</form>

<hr>

<h3>Direct Servlet Links</h3>
<ul>
    <li><a href="hello">HelloServlet (GET)</a></li>
    <li><a href="hello?name=Jahanvi">HelloServlet with Query Param (GET: ?name=Jahanvi)</a></li>
    <li><a href="cookie">CookieServlet</a></li>
    <li><a href="session">SessionServlet</a></li>
    <li><a href="student.jsp">Student JSP (Experiment 7)</a></li>
</ul>

</body>
</html>
