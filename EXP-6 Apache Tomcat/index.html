<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 30px auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .gender, .hobbies {
            margin-top: 6px;
        }
        .gender label, .hobbies label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }
        .btn-group {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 25px;
            margin: 0 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .submit-btn { background: #28a745; color: #fff; }
        .reset-btn  { background: #dc3545; color: #fff; }
        .submit-btn:hover { background: #218838; }
        .reset-btn:hover  { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Registration Form</h2>
        <form action="#" method="post" onsubmit="return validateForm()">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter full name">

            <label for="roll">Roll No</label>
            <input type="text" id="roll" name="roll" placeholder="Enter roll number">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email">

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age">

            <label for="branch">Branch</label>
            <select id="branch" name="branch">
                <option value="">-- Select Branch --</option>
                <option value="CSE">Computer Science (CSE)</option>
                <option value="IT">Information Technology (IT)</option>
                <option value="ECE">Electronics (ECE)</option>
                <option value="MECH">Mechanical (MECH)</option>
                <option value="CIVIL">Civil</option>
            </select>

            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label>Hobbies</label>
            <div class="hobbies">
                <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                <label><input type="checkbox" name="hobbies" value="Sports"> Sports</label>
                <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
                <label><input type="checkbox" name="hobbies" value="Coding"> Coding</label>
            </div>

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter address"></textarea>

            <div class="btn-group">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="reset"  class="reset-btn">Reset</button>
            </div>
        </form>
    </div>

    <script>
        function validateForm() {
            var name   = document.getElementById("name").value.trim();
            var roll   = document.getElementById("roll").value.trim();
            var email  = document.getElementById("email").value.trim();
            var age    = document.getElementById("age").value.trim();
            var branch = document.getElementById("branch").value;
            var gender = document.querySelector('input[name="gender"]:checked');

            if (name === "")   { alert("Please enter your name.");   return false; }
            if (roll === "")   { alert("Please enter roll number."); return false; }
            if (email === "")  { alert("Please enter email.");       return false; }
            if (age === "")    { alert("Please enter age.");         return false; }
            if (branch === "") { alert("Please select a branch.");   return false; }
            if (!gender)       { alert("Please select gender.");     return false; }

            alert("Registration Successful!\n\nName: " + name +
                  "\nRoll: "   + roll +
                  "\nEmail: "  + email +
                  "\nBranch: " + branch +
                  "\nGender: " + gender.value);
            return true;
        }
    </script>
</body>
</html>
